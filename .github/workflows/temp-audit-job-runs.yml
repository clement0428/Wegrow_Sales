name: TEMP - Audit farm_job_runs + sync outbox (read-only, ZD-001 closed-loop)

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: Recent sales-sync job runs (real trigger_source/timestamps/counts)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, job_name, trigger_source, started_at, completed_at, due_count, sent_count, failed_count, blocked_count, oldest_pending_seconds, error_summary FROM farm_job_runs WHERE job_name = 'sales-sync' ORDER BY started_at DESC LIMIT 10" > sales_sync_runs.json
          cat sales_sync_runs.json
      - name: Recent reminders job runs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, job_name, trigger_source, started_at, completed_at, due_count, sent_count, failed_count, blocked_count, oldest_pending_seconds, error_summary FROM farm_job_runs WHERE job_name = 'reminders' ORDER BY started_at DESC LIMIT 10" > reminders_runs.json
          cat reminders_runs.json
      - name: Current sales-sync outbox state (status breakdown + oldest pending)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT status, COUNT(*) as n, MIN(datetime(next_attempt_at)) as oldest_next_attempt FROM farm_sales_sync_outbox GROUP BY status"
      - name: Current notification outbox state (for reminders job)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT status, COUNT(*) as n FROM farm_notification_outbox GROUP BY status"
      - name: Sample of currently-queued sales-sync outbox rows (ids + booking linkage, no customer PII)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, booking_id, event_type, attempt_count, status, next_attempt_at, last_error FROM farm_sales_sync_outbox ORDER BY created_at ASC LIMIT 15"
