name: TEMP zd004 find clement member

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  find:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: List admin-role members (no line_user_id printed, just names and roles)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, display_name, role, last_login_at FROM members WHERE role = 'admin' ORDER BY last_login_at DESC LIMIT 10"
