name: TEMP zd004 send test notification

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  send:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: Send exactly one clearly-labeled acceptance-test LINE push to Clement only (ZD-004), never printing the userId
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT line_user_id FROM members WHERE id = '2482ae6b-bc8c-4abd-b8cf-d68b4f1d6464'" > member.json
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('member.json', 'utf8'));
            const uid = data[0].results[0].line_user_id;
            fs.writeFileSync('uid.txt', uid);
            console.log('userId length:', uid.length);
          "
          rm -f member.json
      - name: Push via real LINE Messaging API (single text message, clearly labeled as a test)
        env:
          LINE_MESSAGING_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_ACCESS_TOKEN }}
        run: |
          PUSH_TO=$(cat uid.txt)
          rm -f uid.txt
          curl -s -X POST "https://api.line.me/v2/bot/message/push" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_MESSAGING_ACCESS_TOKEN}" \
            -H "X-Line-Retry-Key: zd004-accept-test-20261027" \
            --data-raw "{\"to\":\"${PUSH_TO}\",\"messages\":[{\"type\":\"text\",\"text\":\"[系統測試 ZD-004] 這是WeGrow農場預約系統的驗收測試通知，確認LINE Messaging API已恢復正常。此訊息只會發送給Clement本人，請忽略即可。\"}]}" \
            -w "\nhttp_status:%{http_code}\n" -o response.json
          echo "--- LINE API response body ---"
          cat response.json
