name: TEMP - Requeue ZD-001 real credential-failure dead letters only (not test-exclusion rows)

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  requeue:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: Show the exact 8 rows before touching anything (sanity check: must all be 401, none test-exclusion)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, booking_id, event_type, last_error FROM farm_sales_sync_outbox WHERE id IN ('fa29d540-c955-4544-9784-6d01c93fd129','cc44cc55-2fe5-4061-a16c-d8b780488c1c','81415cdb-4194-4ee8-adc4-be84b3d482f5','cd78c694-8458-4788-9898-8b74d6310350','92078681-36ce-4b0c-9313-4d2c7c5f7815','d22b1a7e-4aba-4870-889e-5ef15d472e99','0d174f1c-2fb6-4c60-b21e-b441f0e6a337','3573e078-8659-450b-9753-1bab9b0ec4a7')"
      - name: Requeue ONLY these 8 (401-credential-bug dead letters) — leaves the 4 intentional test-exclusion rows (WG-261018-*) untouched
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --command "UPDATE farm_sales_sync_outbox SET status = 'queued', attempt_count = 0, next_attempt_at = datetime('now'), leased_until = NULL, last_error = last_error || ' [ZD-001 manual requeue after FARM_SYNC_API_KEY fix, Claude, 2026-10-27]' WHERE id IN ('fa29d540-c955-4544-9784-6d01c93fd129','cc44cc55-2fe5-4061-a16c-d8b780488c1c','81415cdb-4194-4ee8-adc4-be84b3d482f5','cd78c694-8458-4788-9898-8b74d6310350','92078681-36ce-4b0c-9313-4d2c7c5f7815','d22b1a7e-4aba-4870-889e-5ef15d472e99','0d174f1c-2fb6-4c60-b21e-b441f0e6a337','3573e078-8659-450b-9753-1bab9b0ec4a7')"
      - name: Confirm after state (8 rows now queued, test-exclusion rows still failed/untouched)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT status, COUNT(*) as n FROM farm_sales_sync_outbox GROUP BY status"
