name: TEMP - List booking Worker secret names (read-only, ZD-004)

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: List secret names only (never values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler secret list --env production
