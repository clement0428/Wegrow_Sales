name: TEMP exclude reminder test row

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  exclude:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: Flag the single madou_work_card_event test row as permanently_excluded (same test booking WG-261018-014C02 as the already-excluded sales-sync rows)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --command "UPDATE farm_notification_outbox SET permanently_excluded = 1 WHERE id = 'e2e-accept-cancel-card-307e5720ea02b044' AND status = 'failed'"
      - name: Confirm after state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT status, permanently_excluded, COUNT(*) as n FROM farm_notification_outbox GROUP BY status, permanently_excluded"
