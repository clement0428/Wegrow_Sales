name: TEMP check zd001 after cron

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: Recent sales-sync runs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, trigger_source, started_at, due_count, sent_count, failed_count, error_summary FROM farm_job_runs WHERE job_name = 'sales-sync' ORDER BY started_at DESC LIMIT 5"
      - name: Outbox status breakdown now
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT status, COUNT(*) as n FROM farm_sales_sync_outbox GROUP BY status"
      - name: Fate of the 8 requeued rows specifically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, status, attempt_count, last_error, accepted_at FROM farm_sales_sync_outbox WHERE id IN ('fa29d540-c955-4544-9784-6d01c93fd129','cc44cc55-2fe5-4061-a16c-d8b780488c1c','81415cdb-4194-4ee8-adc4-be84b3d482f5','cd78c694-8458-4788-9898-8b74d6310350','92078681-36ce-4b0c-9313-4d2c7c5f7815','d22b1a7e-4aba-4870-889e-5ef15d472e99','0d174f1c-2fb6-4c60-b21e-b441f0e6a337','3573e078-8659-450b-9753-1bab9b0ec4a7')"
