name: TEMP check reminder dead letter

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json
      - run: npm ci
      - name: Full row detail (no customer PII columns selected)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT id, booking_id, channel, notification_type, status, attempt_count, created_at, scheduled_at, next_attempt_at, last_error FROM farm_notification_outbox WHERE status = 'failed'"
      - name: Check linked booking (non-PII fields only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --env production --json --command "SELECT b.id, b.booking_number, b.created_at, b.cancelled_at FROM farm_bookings b JOIN farm_notification_outbox o ON o.booking_id = b.id WHERE o.status = 'failed'"
