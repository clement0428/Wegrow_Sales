name: TEMP - Set SALES_SYNC_API_KEY Worker secret (one-off)

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: farm-booking/aama-tennis-club-share

jobs:
  set-secret:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-booking/aama-tennis-club-share/package-lock.json

      - run: npm ci

      - name: Put SALES_SYNC_API_KEY secret (value never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_KEY: ${{ secrets.TEMP_SALES_SYNC_KEY }}
        run: echo "$SYNC_KEY" | npx wrangler secret put SALES_SYNC_API_KEY --env production
